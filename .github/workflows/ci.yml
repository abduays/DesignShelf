name: Validate DesignShelf

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Run automated tests and package checks
        run: |
          npm test
          npm run check
          npm run validate:dtcg
      - name: Install Playwright
        run: npm install --no-save --no-package-lock playwright@1.57.0
      - name: Install Chrome stable and Firefox
        run: npx playwright install --with-deps chrome firefox
      - name: Run cross-browser smoke tests
        run: node tests/browser-smoke.mjs
