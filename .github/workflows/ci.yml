name: Validate DesignShelf

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Run automated tests and package checks
        run: |
          npm test
          npm run check
          npm run validate:dtcg
      - name: Install Playwright
        run: npm install --no-save --no-package-lock playwright@1.57.0
      - name: Install Chrome stable and Firefox
        run: npx playwright install chromium chrome firefox
      - name: Run cross-browser smoke tests
        run: node tests/browser-smoke.mjs
      - name: Build and verify browser packages
        run: |
          set -euo pipefail
          version="$(node -p "require('./package.json').version")"
          mkdir -p dist
          (cd chrome && zip -X -qr "../dist/designshelf-chrome-v$version.zip" .)
          (cd firefox && zip -X -qr "../dist/designshelf-firefox-v$version.zip" .)
          for archive in dist/*.zip; do
            unzip -t "$archive"
            listing="$(unzip -Z1 "$archive")"
            for required in manifest.json background.js content.js sidebar.html sidebar.css project-import.js storage-usage.js export-engine.js token-export.js visual-diff.js icons/icon128.png; do
              printf '%s\n' "$listing" | grep -Fxq "$required" || { echo "Missing $required in $archive"; exit 1; }
            done
            if printf '%s\n' "$listing" | grep -Eq '(^|/)(\.git|node_modules|tests|docs)/'; then
              echo "Unexpected development files found in $archive"
              exit 1
            fi
          done
          sha256sum dist/*.zip > dist/SHA256SUMS.txt
      - name: Install and smoke-test the generated Chrome ZIP
        run: |
          set -euo pipefail
          version="$(node -p "require('./package.json').version")"
          mkdir -p dist/chrome-package-smoke
          chrome_archive="dist/designshelf-chrome-v${version}.zip"
          unzip -q "$chrome_archive" -d dist/chrome-package-smoke
          xvfb-run -a node tests/chrome-package-smoke.mjs dist/chrome-package-smoke
      - name: Upload browser packages
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@v4
        with:
          name: designshelf-v0.8.3-browser-packages
          path: dist/
          if-no-files-found: error
          retention-days: 30
